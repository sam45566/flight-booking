<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Check In. Sky Wings</title>

<link rel="stylesheet" href="checkInStyle.css">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com//libs/font-awesome/6.0.0-beta3/css/all.min.css">

</head>

<body>

<header class="main-header">

<div class="container header-content">

<div class="logo">

<a href="home.html">Sky Wings</a>

</div>

<nav class="main-nav">

<ul>

<li><a href="home.html">Flights</a></li>

<li><a href="myTrips.html">My Trips</a></li>

<li><a href="checkIn.html" class="active">Check In</a></li>

</ul>

</nav>

<button class="login-btn" id="openLogin">Login</button>

</div>

</header>

<main>

<section class="page-section">

<div class="container">

<h2 class="page-title">Online Check-In for Sky Wings</h2>

<p class="page-subtext">To check in for your Sky Wings flight please enter your details.</p>

<div class="form-card">

<form class="checkin-form">

<div class="input-group">

<label for="booking-code">Your Booking Code for Sky Wings</label>

<input type="text" id="booking-code" placeholder="For example ABC123">

</div>

<div class="input-group">

<label for="last-name">Your Last Name on Sky Wings Booking</label>

<input type="text" id="last-name" placeholder="Your surname">

</div>

<button type="submit" class="search-button">Check In, for Sky Wings</button>

</form>

</div>

</div>

</section>

</main>

</div>
